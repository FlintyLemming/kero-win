name: Release

on:
  # Run by hand: releases mygo.json's version from the branch it runs on in a
  # new draft (replacing any existing draft and moving its tag to this commit).
  # A published release stays as it is.
  workflow_dispatch:

permissions:
  contents: write # the draft release, its tag, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Replace the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version mygo.json)"
          draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$draft" = "false" ]; then
            echo "::error::$tag is published already: bump the version in mygo.json"
            exit 1
          fi
          if [ "$draft" = "true" ]; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            git push origin ":refs/tags/$tag"
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version mygo.json)"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$tag" --generate-notes
          fi

  build:
    needs: draft-release
    name: Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "windows/amd64,windows/arm64" -upload

  # What a release is of passes its tests, as from a branch run by hand.
  test:
    needs: draft-release
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./internal/...

  # Verify all Windows desktop release assets are uploaded before publishing.
  assets:
    needs: [build, test]
    name: Check the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(jq -r .version mygo.json)"
          names="$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          want="install.ps1 SHA256SUMS"
          for arch in amd64 arm64; do
            want="$want kero-setup-$version-$arch.exe kero-$version-windows-$arch.tar.gz update-windows-$arch.json"
          done
          for w in $want; do
            echo "$names" | grep -qxF "$w" || { echo "::error::v$version has no $w"; exit 1; }
          done
